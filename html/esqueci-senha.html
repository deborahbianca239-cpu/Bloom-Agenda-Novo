<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha - Bloom Agenda</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <i class="fas fa-calendar-alt"></i>
      </div>
      <h2>Bloom Agenda</h2>
      <p class="subtitle">
        Recupere sua senha. Informe seu e-mail e o código de verificação.
      </p>
      <form id="forgotForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="E-mail" required />
        </div>
        <div class="input-group">
          <i class="fas fa-key"></i>
          <input type="text" id="codigo" placeholder="Código de verificação" required />
        </div>
        <button type="submit" class="login-btn">
          <i class="fas fa-check-circle"></i> Verificar Código
        </button>
        <div id="errorMsg" class="error">Código inválido ou e-mail não encontrado!</div>
        <div id="successMsg" class="success">
          Código verificado! Redirecionando...
        </div>
      </form>
      <div class="links">
        <a href="index.html" class="back-link">
          <i class="fas fa-arrow-left"></i> Voltar ao login
        </a>
      </div>

    <script>
      const form = document.getElementById("forgotForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const codigo = document.getElementById("codigo").value;

        // Simulação de verificação - substituir por integração real
        document.getElementById("errorMsg").style.display = "none";
        document.getElementById("successMsg").style.display = "block";

        setTimeout(() => {
          alert("Funcionalidade de recuperação de senha em desenvolvimento.");
          document.getElementById("successMsg").style.display = "none";
        }, 1500);
      });
    </script>
  </body>
</html>
