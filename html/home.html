<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom Agenda</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css"/>
  </head>
  <body>
    <div class="container">
      <div class="main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="text-center flex-grow-1 mb-0">🌸 Bloom Agenda</h2>
          <button class="btn logout-btn btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>

        <input
          type="text"
          id="calendario"
          class="form-control mb-3"
          placeholder="Data opcional"
        />

        <div class="row mb-4 form-row">
          <div class="col-md">
            <select id="diaSemana" class="form-select">
              <option value="segunda">Segunda-feira</option>
              <option value="terca">Terça-feira</option>
              <option value="quarta">Quarta-feira</option>
              <option value="quinta">Quinta-feira</option>
              <option value="sexta">Sexta-feira</option>
              <option value="sabado">Sábado</option>
              <option value="domingo">Domingo</option>
            </select>
          </div>
          <div class="col-md">
            <input type="time" id="horario" class="form-control" />
          </div>
          <div class="col-md">
            <input
              type="text"
              id="tarefa"
              class="form-control"
              placeholder="Digite a tarefa..."
            />
          </div>
          <div class="col-md-auto">
            <button id="btnAdicionar" class="btn w-100 h-100">
              + Adicionar
            </button>
          </div>
        </div>

        <div id="dias">
          <div class="day-section">
            <h5>Segunda-feira</h5>
            <div id="segunda"></div>
          </div>
          <div class="day-section">
            <h5>Terça-feira</h5>
            <div id="terca"></div>
          </div>
          <div class="day-section">
            <h5>Quarta-feira</h5>
            <div id="quarta"></div>
          </div>
          <div class="day-section">
            <h5>Quinta-feira</h5>
            <div id="quinta"></div>
          </div>
          <div class="day-section">
            <h5>Sexta-feira</h5>
            <div id="sexta"></div>
          </div>
          <div class="day-section">
            <h5>Sábado</h5>
            <div id="sabado"></div>
          </div>
          <div class="day-section">
            <h5>Domingo</h5>
            <div id="domingo"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <script>
      // 1. Resgata o usuário salvo na memória pelo login
      const usuarioLogado = JSON.parse(localStorage.getItem("usuario"));

      // Segurança: se o usuário tentar burlar ou acessar sem logar, volta pra index
      if (!usuarioLogado || !usuarioLogado.id) {
        alert("Por favor, faça login primeiro.");
        window.location.href = "index.html";
      }

      flatpickr("#calendario", { locale: "pt" });

      // Auto set current day
      const now = new Date();
      const days = {
        0: "domingo",
        1: "segunda",
        2: "terca",
        3: "quarta",
        4: "quinta",
        5: "sexta",
        6: "sabado",
      };
      document.getElementById("diaSemana").value = days[now.getDay()];

      document
        .getElementById("btnAdicionar")
        .addEventListener("click", adicionarTarefa);

      // ADICIONAR TAREFA NO SEU BACKEND LOCAL (PORTA 3006)
      async function adicionarTarefa() {
        const dia = document.getElementById("diaSemana").value;
        const horario = document.getElementById("horario").value;
        const tarefa = document.getElementById("tarefa").value.trim();

        if (!tarefa) {
          alert("Digite uma tarefa!");
          return;
        }

        try {
          const response = await fetch("http://localhost:3006/tarefas", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              usuario_id: usuarioLogado.id, // Vincula a tarefa ao ID do usuário logado
              dia,
              horario,
              tarefa
            }),
          });

          const data = await response.json();

          if (data.success) {
            document.getElementById("tarefa").value = "";
            document.getElementById("horario").value = "";
            carregarTarefas();
          } else {
            alert("Erro ao salvar tarefa no servidor.");
          }
        } catch (error) {
          console.error("Erro na conexão:", error);
          alert("Não foi possível conectar ao servidor backend.");
        }
      }

      // CARREGAR TAREFAS DO BACKEND LOCAL (PORTA 3006)
      async function carregarTarefas() {
        try {
          const response = await fetch(`http://localhost:3006/tarefas/${usuarioLogado.id}`);
          const resData = await response.json();

          if (!resData.success) {
            console.error("Erro na busca:", resData.message);
            return;
          }

          const data = resData.data;

          // Organiza por horário
          data.sort((a, b) => (a.horario || "").localeCompare(b.horario || ""));
          
          // Limpa todas as colunas visuais
          [
            "segunda",
            "terca",
            "quarta",
            "quinta",
            "sexta",
            "sabado",
            "domingo",
          ].forEach((d) => (document.getElementById(d).innerHTML = ""));

          // Renderiza as tarefas vindas do seu banco MySQL
          data.forEach((t) => {
            const div = document.getElementById(t.dia);
            if (div) {
              div.innerHTML += `
              <div class="task-item ${t.completed ? "completed" : ""}" data-id="${t.id}">
                <input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleComplete('${t.id}', this.checked)">
                <div>
                  <strong>${t.horario || "--:--"}</strong> - <span class="task-text">${t.tarefa}</span>
                </div>
                <div class="task-actions">
                  <button class="btn btn-sm btn-warning" onclick="editTask('${t.id}', '${t.tarefa.replace(/'/g, "\\'")}')" title="Editar">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')" title="Deletar">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            `;
            }
          });
        } catch (error) {
          console.error("Erro ao carregar tarefas:", error);
        }
      }

      // ATUALIZAR STATUS DE CONCLUÍDO (CHECKBOX)
      async function toggleComplete(id, completed) {
        try {
          const response = await fetch(`http://localhost:3006/tarefas/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completed })
          });
          const data = await response.json();
          if (data.success) carregarTarefas();
        } catch (error) {
          console.error(error);
        }
      }

      // EDITAR TEXTO DA TAREFA
      async function editTask(id, currentText) {
        const newText = prompt("Editar tarefa:", currentText);
        if (newText !== null && newText.trim()) {
          try {
            const response = await fetch(`http://localhost:3006/tarefas/${id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tarefa: newText.trim() })
            });
            const data = await response.json();
            if (data.success) carregarTarefas();
          } catch (error) {
            console.error(error);
          }
        }
      }

      // EXCLUIR TAREFA DO BANCO
      async function deleteTask(id) {
        if (confirm("Deletar tarefa?")) {
          try {
            const response = await fetch(`http://localhost:3006/tarefas/${id}`, {
              method: "DELETE"
            });
            const data = await response.json();
            if (data.success) carregarTarefas();
          } catch (error) {
            console.error(error);
          }
        }
      }

      // FAZER LOGOUT LIMPADOR
      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "index.html";
      }

      // Executa automaticamente ao abrir a página
      carregarTarefas();
    </script>
  </body>
</html>
